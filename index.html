<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#090b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lunacy">
<meta name="description" content="Lunacy Depths: an idle dungeon RPG.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;background:#090b12}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Lunacy Depths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen phone game. Top bar, battle stage canvas, scrolling tab panel, bottom nav. Deliberately dark-only (night dungeon). */
:root{
  --bg:#090b12; --panel:#11141f; --panel2:#181c2b; --line:#262c42; --ink:#e8e2d0; --mute:#8e93a7;
  --moon:#a9c1ff; --gold:#e8b85a; --blood:#c8323c; --ok:#6fd08c; --warn:#e8a15a;
  --r0:#b9bcc6; --r1:#6fd08c; --r2:#5aa0ff; --r3:#c07cff; --r4:#ffd36e;
  --display:'Cinzel', Georgia, 'Times New Roman', serif;
  --body:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;background:var(--bg)}
header#top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:linear-gradient(#0e1120,#0a0c15)}
#logo{background:none;border:0;padding:0;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:17px;line-height:1;text-align:left;color:var(--ink)}
#logo span{display:block;font-size:9.5px;letter-spacing:.42em;color:var(--moon);font-weight:700;margin-top:3px}
.curs{display:flex;gap:6px;margin-left:auto;min-width:0}
.cur{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 5px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{width:13px;height:13px;display:inline-block;flex:none}
.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#e8b85a 45%,#8a5d1c)}
.stone{transform:rotate(45deg) scale(.82);background:linear-gradient(135deg,#e2ecff,#7d9cf0 50%,#3a4f9a);border-radius:2px}
.shard{clip-path:polygon(50% 0,85% 55%,50% 100%,15% 55%);background:linear-gradient(#e6c8ff,#9b5cf0)}
#me{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-family:var(--display);font-weight:700;flex:none}
#evbar{display:flex;gap:6px;overflow-x:auto;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:#0b0d16;border-bottom:1px solid var(--line);scrollbar-width:none}
#evbar:empty{display:none}
.evchip{white-space:nowrap;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid;letter-spacing:.02em}
#view{flex:1;position:relative;min-height:0}
#stage{position:absolute;inset:0;background:#05060a;overflow:hidden}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-block:12px 0;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none;text-shadow:0 2px 10px #000}
#hud .hz{min-width:0}
#hZone{font-family:var(--display);font-weight:800;font-size:clamp(17px,4.6vw,22px);letter-spacing:.04em;line-height:1.05;text-wrap:balance}
#hFloor{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:.85;text-align:right;font-variant-numeric:tabular-nums}
#hFloor small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--moon);font-weight:800;margin-top:4px}
#hPips{display:flex;gap:5px;margin-top:8px}
#hPips i{width:18px;height:4px;border-radius:2px;background:#ffffff26}
#hPips i.d{background:var(--moon)}#hPips i.c{background:#ffffff;box-shadow:0 0 8px var(--moon)}#hPips i.b{background:#c07cff}
#hPush{pointer-events:auto;margin-top:8px;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;border:1px solid;background:#0a0c15cc;backdrop-filter:blur(6px)}
#hRaid{pointer-events:auto;margin-top:6px;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;border:1px solid #6a5cff;background:#140f2ccc;color:#d6ccff;backdrop-filter:blur(6px)}
#hPush.on{color:#cfe0ff;border-color:#3e5299}#hPush.off{color:#ffe3a6;border-color:#8a6a2a}
#hNext{font-size:12px;color:var(--mute);margin-top:3px}
#actions{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#05060ae6 35%);border:0}
#panel[hidden]{display:none!important}
#mini{position:sticky;top:-12px;z-index:5;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;background:#0e1120f2;border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(8px);margin-top:-2px}
#mini .mt{font-size:12.5px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .go{font-size:12px;font-weight:800;color:var(--moon);grid-row:span 2}
#mini .mb{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#mini .mb span{height:5px;border-radius:3px;background:#22283c;overflow:hidden}
#mini .mb span i{display:block;height:100%}
#cv{width:100%;height:100%;display:block}
#panel{position:absolute;inset:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;padding-block:12px 18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
nav#nav{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);background:#0b0d16;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav#nav button{background:none;border:0;padding:9px 0 8px;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;min-width:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px}
nav#nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
nav#nav button[aria-current="true"]{color:var(--ink)}
nav#nav button[aria-current="true"] svg{stroke:var(--moon)}
h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--moon);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
h3 small{font-family:var(--body);letter-spacing:.02em;text-transform:none;color:var(--mute);font-weight:500;font-size:12.5px}
.sec{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.muted{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
.btn.pri{background:linear-gradient(#2a3a6e,#1d2a52);border-color:#3e5299}
.btn.gold{background:linear-gradient(#5a431a,#3d2c10);border-color:#8a6a2a;color:#ffe3a6}
.btn:disabled{opacity:.42;cursor:default}
.btn.sm{padding:5px 9px;font-size:13px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:6px 4px;font-weight:700;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:#2a3456;color:var(--ink)}
.floorcard{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:end}
.floorcard h2{font-size:19px}
.flnum{font-family:var(--display);font-size:38px;font-weight:800;line-height:.9;text-align:right;font-variant-numeric:tabular-nums}
.flnum small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.floorcard .meta{grid-column:1/-1;font-size:13px;color:var(--mute)}
.floorcard .acts{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:800;font-size:15px}
.row .d{font-size:12.5px;color:var(--mute)}
.row .lv{font-size:12px;color:var(--moon);font-weight:700;margin-left:6px}
.costbtn{min-width:92px;display:flex;align-items:center;justify-content:center;gap:5px}
.bar{height:6px;background:#22283c;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5d79d6,#a9c1ff)}
.skillrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.skillrow:first-child{border-top:0}
.sk-ico{width:44px;height:44px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px}
.sk-lv{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.statgrid div{background:var(--panel);padding:8px 12px}
.statgrid b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.statgrid span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.gearwrap{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:start}
.heroprev{background:radial-gradient(circle at 50% 30%,#1c2340,#0b0d16 70%);border:1px solid var(--line);border-radius:10px;aspect-ratio:7/10;max-width:100%;width:100%}
.slots{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--rc,var(--r0));border-radius:8px;padding:6px 9px;min-width:0}
.slot .sl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;grid-column:1/-1}
.slot .nm{font-weight:800;font-size:13.5px;color:var(--rc);min-width:0;overflow-wrap:anywhere;grid-column:1/-1}
.slot .pw{font-size:12px;color:var(--mute);grid-column:1/-1}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:800;color:var(--rc)}
.item .d{font-size:12.5px;color:var(--mute)}
.item .bt{display:flex;gap:6px}
.up{color:var(--ok);font-weight:700}
.trophies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stand{position:relative;aspect-ratio:1/1.15;max-width:100%;border:1px solid var(--line);border-radius:12px 12px 4px 4px;background:radial-gradient(circle at 50% 35%,#232a46,#0d1019 70%);padding:0 0 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 -14px 0 #2a2216}
.stand canvas{width:80%;aspect-ratio:1}
.stand .tn{position:absolute;bottom:2px;left:4px;right:4px;font-size:10.5px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stand .te{font-size:26px;color:var(--mute)}
.raidcard{display:block;width:100%;color:inherit;font:inherit;cursor:pointer}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:7px}
.inv{position:relative;aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-bottom:2px solid var(--rc);border-radius:10px;background:radial-gradient(circle at 50% 40%,#1b2034,#0d1019);padding:0;overflow:hidden}
.inv canvas,.inv img{width:100%;height:100%;display:block;object-fit:contain}
.stand img{width:80%;aspect-ratio:1;object-fit:contain}
.inv .ip{position:absolute;right:4px;top:3px;font-size:11px;font-weight:800;color:#ffd36e;text-shadow:0 1px 3px #000}
.inv .il{position:absolute;left:4px;top:3px;color:#cfd8ff}
.inv .iu{position:absolute;right:4px;bottom:3px;font-size:11px;color:var(--ok)}
.inv .ie{position:absolute;left:4px;bottom:3px;font-size:10px;font-weight:800;color:var(--mute)}
button.slot{text-align:left;font:inherit;color:inherit;cursor:pointer}
.down{color:#d07070;font-weight:700}
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable td{padding:6px 0;border-top:1px solid var(--line)}
.dtable tr:first-child td{border-top:0}
.dtable td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap;padding-left:10px}
.dtable .got{color:var(--ok)}
.dname{font-weight:700;color:var(--rc)}
.dname.unk{color:#596079}
details.dz{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.dz summary{list-style:none;padding:11px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;cursor:pointer}
details.dz summary::-webkit-details-marker{display:none}
details.dz .sw{width:10px;height:28px;border-radius:3px}
details.dz .zn{font-family:var(--display);font-weight:700;font-size:15px}
details.dz .zr{font-size:12px;color:var(--mute)}
details.dz .zc{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
details.dz .dzb{padding:0 12px 12px}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pet .orb{width:30px;height:30px;border-radius:50%}
.pet .pn{font-weight:800}
.pet[aria-pressed="true"]{border-color:var(--moon);background:#171d33}
.pet.locked .orb{background:#20253a!important;box-shadow:none!important}
.pet.locked .pn{color:#596079}
.evcard{border-left:3px solid var(--ec,var(--moon))}
.evcard .en{font-family:var(--display);font-weight:700;font-size:16px}
.mods{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mod{font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.cal{display:flex;flex-direction:column}
.cal div{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.cal div:first-child{border-top:0}
.cal b{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:700}
.passes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pass{border-radius:12px;padding:14px;border:1px solid;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.pass.moonlit{background:linear-gradient(160deg,#1a2442,#0f1427 70%);border-color:#3e5299}
.pass.eclipse{background:linear-gradient(160deg,#3b2a10,#140f08 60%);border-color:#a07a2a}
.pass h2{font-size:20px}
.pass .price{font-size:13px;color:var(--mute)}
.pass .price b{font-size:22px;color:var(--ink);font-family:var(--display)}
.pass ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.pass .tag{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:#e8b85a;color:#2a1c05;border-radius:999px;padding:2px 8px}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pack{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pack b{font-size:18px;display:flex;align-items:center;gap:6px}
.note{font-size:12.5px;color:var(--mute);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.toast{background:#141a2cee;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;max-width:100%;box-shadow:0 6px 20px #0008;animation:tin .25s ease-out}
.toast.rare{border-color:var(--r2)}.toast.leg{border-color:var(--r3);box-shadow:0 0 22px #c07cff55}.toast.pet{border-color:var(--r4);box-shadow:0 0 22px #ffd36e55}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#modal{position:absolute;inset:0;background:#000b;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-height:88%;overflow-y:auto;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:20px}
.sheet.full{max-height:100%;height:100%;border-radius:0;border:0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
input[type=text],input[type=number],input[type=password],select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font:inherit;width:100%;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px #0006}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--mute)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--moon);background:#1c2440}
.creator{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.creator canvas{width:100%;aspect-ratio:7/10;background:radial-gradient(circle at 50% 30%,#1c2340,#0b0d16 70%);border:1px solid var(--line);border-radius:10px}
.cctrl{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:380px){.creator,.gearwrap{grid-template-columns:110px 1fr}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid}

function fmt(n){

  return n.toExponential(2).replace('+','');
}

  out.gear=Object.assign(fresh().gear,(d||{}).gear||{});
  if(out.slay&&!out.slay.perk)out.slay.perk={};
  for(const key of ['ore','fish','food','sig']){const base=fresh().bank[key];if(!Array.isArray(out.bank[key]))out.bank[key]=base;else while(out.bank[key].length<base.length)out.bank[key].push(0)}
  for(const key of ['bag','titles','trophies','dry','errLog'])if(!Array.isArray(out[key]))out[key]=fresh()[key]||[];
  if(!out.titles.length)out.titles=['Adventurer'];

const ANCHOR=new Date(2026,9,19);
function weekendEvent(now){
  const day=now.getDay();if(!(day===5||day===6||day===0))return null;
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(day===0?6:day-1));
  const idx=((Math.round((mon-ANCHOR)/864e5/7))%4+4)%4;
  const t=WEEKENDS[idx];const s=new Date(mon);s.setDate(s.getDate()+4);const e=new Date(mon);e.setDate(e.getDate()+7);
  return Object.assign({},t,{s,e,weekend:true});
}
function majorDates(m){return Object.assign({},m,{s:parseDay(m.s),e:parseDay(m.e)})}
let _evCache=null,_evAt=0;
function activeEvents(){
  const nowMs=Date.now();if(_evCache&&nowMs-_evAt<5000)return _evCache;
  const now=new Date(nowMs);const out=[];
  for(const m of MAJORS){const x=majorDates(m);if(now>=x.s&&now<x.e)out.push(x)}
  const w=weekendEvent(now);if(w)out.push(w);
  if(S.forceEvent){const all=[...MAJORS,...WEEKENDS];const f=all.find(e=>e.id===S.forceEvent);
    if(f&&!out.some(o=>o.id===f.id)){const fs=new Date();const fe=new Date(nowMs+864e5);out.push(Object.assign({},f,{s:fs,e:fe,forced:true}))}}

function applyOffline(sec,manual){
  calc();const cap=PM().off*3600;sec=Math.min(sec,cap);if(sec<60)return null;
  const f=Math.max(1,S.floor-(S.push?1:0));const kt=killTime(f);
  const kills=Math.max(0,Math.floor(sec*0.5/kt));if(kills<1&&!S.gath.act)return null;
  const g=goldFor(f)*C.goldMult*kills;addGold(g);
  const x=xpFor(f)*C.xpMult*kills;const lv0={...C.L};
  const st=STYLEXP[S.style];for(const k in st)S.xp[k]+=x*st[k];S.xp.hp+=x/3;
  const floors=Math.floor(kills/PER_FLOOR);let items=0,rares=[];
  const nDrops=Math.min(60,Math.floor(kills/70*C.luck+floors*(CHEST.common+CHEST.uncommon)));
  for(let i=0;i<nDrops;i++){dropItem(Math.random()<0.3?1:0);items++}
  const pr=1-Math.pow(1-CHEST.rare*C.luck,floors);
  if(Math.random()<pr){const zi=zIdx(f)%10;const p=['helm','body','legs','wep'][Math.floor(Math.random()*4)];giveUnique(`z${zi}_${p}`,true);rares.push(UNI[`z${zi}_${p}`].n)}
  S.kills+=kills;clanPts(kills);marketSim(sec);const gath=offlineGather(sec);calc();
  const lv1=C.L;const ups=Object.keys(lv1).filter(k=>lv1[k]>lv0[k]).map(k=>`${SKN[k]} ${lv0[k]}→${lv1[k]}`);
  return {sec,kills,gold:g,xp:x,items,rares,ups,f,manual,gath};
}

const LBC=[['floor','Deepest floor'],['level','Total level'],['wealth','Wealth'],['bosses','Boss kills'],['raid','Raid clears'],['log','Collection log'],['kc','Dungeon boss kills']];
let lbView=[];
const lb={ladder:null,cat:'floor',zone:0};
const PRE=['Grim','Vex','Moon','Ash','Bone','Iron','Kael','Sol','Night','Frost','Ember','Void','Thorn','Blood','Lune','Crypt','Rift','Dusk','Storm','Hex','Mire','Pale','Wyrm','Raven'];
const SFX=['blade','fang','walker','born','heart','reaver','song','ward','claw','shade','bane','light','hollow','crow','tusk','mourne','veil','forge'];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const _riv={};
function rivals(ladder){
  const day=Math.floor(Date.now()/864e5);const key=ladder+day;if(_riv[key])return _riv[key];
  const rnd=mulberry(ladder==='sup'?7771:ladder==='season'?9991:3331);const mat=ladder==='season'?clamp((Date.now()-parseDay(SEASON.s))/(100*864e5),0.03,1):clamp((Date.now()-new Date(2026,9,20))/(240*864e5),0.06,1);
  const used=new Set(),out=[];
  for(let i=0;i<70;i++){
    let nm;do{const a=PRE[Math.floor(rnd()*PRE.length)],b=SFX[Math.floor(rnd()*SFX.length)],f=rnd();
      nm=f<0.45?a+b:f<0.7?a+' '+b[0].toUpperCase()+b.slice(1):f<0.9?a+b+Math.floor(rnd()*99):'x'+a+b+'x'}while(used.has(nm));used.add(nm);
    const sk=Math.pow(rnd(),1.7),r=rnd(),r2=rnd();
    const floor=Math.max(3,Math.round(8+(70+380*Math.pow(mat,0.6))*Math.pow(sk,1.15)*(ladder==='sup'?1.12:1)*(0.97+0.06*mulberry(i*31+day)())));
    const lv=Math.min(99,8+floor*0.25+r*6),total=Math.min(792,Math.round(lv*3+Math.min(99,lv+4)+4*Math.min(99,lv*(0.6+r2*0.5))));
    const kc={};for(let z=0;z<10;z++){const past=floor-(z+1)*50;kc[z]=past>=0?Math.round((0.3+r2)*12*(1+past/35)):0}
    const title=i<3&&mat>0.3?'Lunar Elite':r<0.38?'Founder':r>0.97?'Raid Champion':'Adventurer';
    const asc=floor>=300?Math.floor((floor-200)/110):0;const raid=floor>=40?Math.round((floor-40)*r2*0.5):0;
    const ct=rnd()<0.7?CLANS[Math.floor(rnd()*CLANS.length)]:null;
    out.push({ladder,clan:ct?{tag:ct[1],color:ct[2],name:ct[0]}:null,priv:rnd()<0.08,asc,raid,name:nm,title:asc>=1&&title==='Adventurer'?'Ascendant':title,floor,level:total,wealth:goldFor(floor)*(120+r*900)*(ladder==='sup'?1.6:1),bosses:Math.round(floor*(0.5+r*1.3)),log:Math.min(62,Math.round(Math.max(0,floor-15)/13*(0.6+r2*0.8))),kc});
  }
  return _riv[key]=out;
}

/* ================= GATHERING & SMITHING ================= */
const ORES=[['Iron ore',1],['Bloodite',10],['Cinderite',20],['Rimesilver',30],['Tideglass',40],['Obsidian shard',50],['Gloomroot ore',60],['Crimsonite',70],['Voidstone',80],['Eclipsium',90]];
const FISH=[['Glowfin',1,0.10,1],['Bog eel',12,0.14,51],['Ember carp',25,0.18,101],['Frostjaw',38,0.22,151],['Tide shark',52,0.26,251],['Void ray',68,0.30,351],['Lunar koi',85,0.36,451]];
const GSK=['mine','fish','cook','smith'];
const oreGate=t=>t*50+1;
const UPGRATE=[1,1,1,0.9,0.8,0.7,0.6,0.5,0.4,0.3];
PETS.mole={n:'Pebble Mole',c:'#c9a26a',src:'Mining · 1/15,000 actions',kind:'skill'};
PETS.otter={n:'Glimmer Otter',c:'#7fd6e0',src:'Fishing · 1/15,000 catches',kind:'skill'};
PETS.imp={n:'Anvil Imp',c:'#ff8a3d',src:'Smithing · 1/400 reinforces',kind:'skill'};
const sLvl=k=>lvl(S.xp[k]||0);
function actTime(k){return Math.max(1.6,4*(1-0.005*sLvl(k)))*(S.boost.xp>Date.now()?0.85:1)}
function addSkillXp(k,x){const b=sLvl(k);S.xp[k]=(S.xp[k]||0)+x*C.xpMult;S.xpEarned=(S.xpEarned||0)+x*C.xpMult;const a=sLvl(k);if(a>b){toast(`${SKN[k]} level ${a}`);sfx('level');if(tab==='camp')show('camp')}}
function gatherLabel(){const a=S.gath.act;if(!a)return '';const [k,i]=a.split(':');return k==='mine'?`Mining ${ORES[i][0]}`:k==='fish'?`Fishing ${FISH[i][0]}`:`Cooking ${FISH[i][0]}`}
function canDo(k,i){
  if(k==='mine')return sLvl('mine')>=ORES[i][1]&&S.bestEver>=oreGate(i);
  if(k==='fish')return sLvl('fish')>=FISH[i][1]&&S.bestEver>=FISH[i][3];
  if(k==='cook')return sLvl('cook')>=FISH[i][1]&&S.bank.fish[i]>0;
  return false;
}
function doAction(k,i,quiet){
  if(k==='mine'){const ok=Math.random()<Math.min(0.97,0.6+(sLvl('mine')-ORES[i][1])*0.02);
    if(ok){S.bank.ore[i]++;addSkillXp('mine',4+i*5);dailyProg('gather',1);if(Math.random()<1/250){const n=1+Math.floor(Math.random()*3);S.stones+=n;if(!quiet)toast(`You found ${n} Moonstone${n>1?'s':''} in the rock`)}if(Math.random()<1/15000*C.petLuck)givePet('mole',quiet)}}
  else if(k==='fish'){const ok=Math.random()<Math.min(0.95,0.5+(sLvl('fish')-FISH[i][1])*0.02);
    if(ok){S.bank.fish[i]++;addSkillXp('fish',5+i*8);dailyProg('gather',1);if(Math.random()<1/15000*C.petLuck)givePet('otter',quiet)}}
  else if(k==='cook'){if(S.bank.fish[i]<=0)return false;S.bank.fish[i]--;const burn=Math.max(0,0.5-(sLvl('cook')-FISH[i][1])*0.02);
    if(Math.random()>=burn){S.bank.food[i]++;addSkillXp('cook',6+i*9)}else{S.burnt=(S.burnt||0)+1;addSkillXp('cook',2)}}
  return true;
}
function gatherStep(dt){
  const a=S.gath.act;if(!a)return;const [k,si]=a.split(':');const i=+si;
  if(!canDo(k,i)){S.gath.act=null;S.gath.prog=0;toast(k==='cook'?'Out of raw fish to cook':'Gathering stopped');return}
  S.gath.prog+=dt/actTime(k);
  while(S.gath.prog>=1){S.gath.prog-=1;doAction(k,i);if(k==='cook'&&S.bank.fish[i]<=0){S.gath.act=null;S.gath.prog=0;toast('All fish cooked');break}}
}
function offlineGather(sec){
  const a=S.gath.act;if(!a)return null;const [k,si]=a.split(':');const i=+si;if(!canDo(k,i))return null;
  let n=Math.floor(sec*0.5/actTime(k));if(k==='cook')n=Math.min(n,S.bank.fish[i]);n=Math.min(n,200000);
  const before={ore:S.bank.ore[i],fish:S.bank.fish[i],food:S.bank.food[i]},lv0=sLvl(k);
  for(let j=0;j<Math.min(n,20000);j++)doAction(k,i,true);
  if(n>20000){const ratio=n/20000;if(k==='mine')S.bank.ore[i]=before.ore+(S.bank.ore[i]-before.ore)*ratio;if(k==='fish')S.bank.fish[i]=before.fish+(S.bank.fish[i]-before.fish)*ratio}
  for(const key of ['ore','fish','food'])S.bank[key]=S.bank[key].map(Math.floor);
  const got=k==='mine'?S.bank.ore[i]-before.ore:k==='fish'?S.bank.fish[i]-before.fish:S.bank.food[i]-before.food;
  if(k==='cook'&&S.bank.fish[i]<=0)S.gath.act=null;
  return {label:k==='mine'?ORES[i][0]:k==='fish'?'raw '+FISH[i][0]:'cooked '+FISH[i][0],got,lv:sLvl(k)>lv0?`${SKN[k]} ${lv0}→${sLvl(k)}`:null};
}
/* ----- food ----- */
let eatCd=0;
function bestFood(){for(let i=FISH.length-1;i>=0;i--)if(S.bank.food[i]>0)return i;return -1}
function foodCount(){return S.bank.food.reduce((a,b)=>a+b,0)}
function eat(auto){

}
/* ----- smithing ----- */
const oreOf=it=>Math.min(9,it.tier);
function reinforceCost(it){const p=it.plus||0;return {ore:Math.ceil(10*Math.pow(p+1,1.6)),gold:goldFor(oreOf(it)*50+1)*15*(p+1),req:Math.max(1,5*(p+1)),rate:UPGRATE[p]}}
function forgeCost(t){return {ore:25,gold:goldFor(t*50+1)*40,req:t*10+1}}
function reinforce(slot){
  const it=S.gear[slot];const p=it.plus||0;if(p>=reinforceCap(it)){toast(it.u&&!it.cr?'Already +10':'Crafted and regular gear stop at +5. Only dropped uniques reach +10.');return}const c=reinforceCost(it);const o=oreOf(it);
  if(sLvl('smith')<c.req){toast(`Needs Smithing ${c.req}`);return}
  if(S.bank.ore[o]<c.ore||S.gold<c.gold){toast(`Needs ${c.ore} ${ORES[o][0]} and ${fmt(c.gold)} gold`);return}
  S.bank.ore[o]-=c.ore;S.gold-=c.gold;S.reinforces=(S.reinforces||0)+1;
  if(Math.random()<1/400*C.petLuck)givePet('imp');
  if(Math.random()<c.rate){it.power*=(1+0.12*(p+1))/(1+0.12*p);it.plus=p+1;addSkillXp('smith',25*(o+1)*(p+1));calc();
    if(it.plus>=7)banner(`+${it.plus} REINFORCED`,itemName(it),'#e8b85a');else toast(`Success: ${itemName(it)}`)}
  else{addSkillXp('smith',5*(o+1));B.shake=0.2;toast(`The metal cracked. ${itemName(it)} stays at +${p}.`)}
}
function forge(t,slot){
  const c=forgeCost(t);if(sLvl('smith')<c.req){toast(`Needs Smithing ${c.req}`);return}
  if(S.bank.ore[t]<c.ore||S.gold<c.gold){toast(`Needs ${c.ore} ${ORES[t][0]} and ${fmt(c.gold)} gold`);return}
  S.bank.ore[t]-=c.ore;S.gold-=c.gold;const it=mkItem(slot,t,1,{wt:slot==='weapon'?randWt():null});
  if(Math.random()<0.05+sLvl('smith')*0.001){it.plus=1;it.power*=1.12}
  addSkillXp('smith',30*(t+1));const cur=S.gear[slot];receive(it,'',true);
  toast(S.gear[slot]===it?`Forged and equipped ${itemName(it)}`:`Forged ${itemName(it)}. Your current one is stronger, so it was salvaged.`);calc();
}

}
function realItem(o){const t=o.it;const it=mkItem(t.slot,t.tier,t.r,{u:t.u,wt:t.wt});if(t.plus){it.plus=t.plus;it.power*=1+0.12*t.plus}if(t.cr)it.cr=true;return it}
function lName(o){return o.cat==='gear'?itemName(o.it):RESN[o.cat](o.i)}
function buyListing(id,n){
  const o=listings().find(x=>x.id===id);if(!o)return;const left=o.qty-(S.market.bought[id]||0);n=Math.min(left,n);if(n<=0)return;
  const cost=o.price*n;if(S.gold<cost){toast(`Needs ${fmt(cost)} gold`);return}
  S.gold-=cost;S.market.bought[id]=(S.market.bought[id]||0)+n;S.market.trades++;
  if(o.cat==='gear'){const it=realItem(o);receive(it,'',true);toast(`Bought ${itemName(it)}${S.gear[it.slot]===it?' and equipped it':''}`);calc()}
  else{S.bank[o.cat][o.i]+=n;toast(`Bought ${fmtInt(n)} ${lName(o)}`)}
}
function createOffer(src,qty,price){
  if(S.market.offers.length>=marketSlots()){toast('All offer slots are in use');return false}
  price=Math.max(1,Math.round(price));let o;
  if(src.startsWith('res:')){const [,cat,i]=src.split(':');const have=S.bank[cat][+i];qty=Math.min(Math.floor(qty),have);if(qty<=0)return false;S.bank[cat][+i]-=qty;o={id:uid(),cat,i:+i,qty,price,filled:0,ready:0,acc:0,at:Date.now()}}
  else{const idx=S.bag.findIndex(x=>x.id===src.slice(4));if(idx<0)return false;const it=S.bag.splice(idx,1)[0];o={id:uid(),cat:'gear',it,qty:1,price,filled:0,ready:0,acc:0,at:Date.now()}}
  S.market.offers.push(o);toast(`Listed ${o.qty>1?fmtInt(o.qty)+' ':''}${lName(o)}`);return true;
}
function marketSim(sec){
  for(const o of S.market.offers){if(o.filled>=o.qty)continue;
    const g=o.cat==='gear'?guideItem(o.it):guideRes(o.cat,o.i);const ratio=o.price/g;const p=Math.pow(clamp(1.5-ratio,0,1),2);if(p<=0)continue;
    let n=0;
    if(o.cat==='gear'){const rate=p*(o.it.r>=2?0.6:1.5);if(Math.random()<1-Math.exp(-rate*sec/3600))n=1}
    else{o.acc+=o.qty*p*2*sec/3600;n=Math.min(o.qty-o.filled,Math.floor(o.acc));o.acc-=n}
    if(n>0){o.filled+=n;o.ready+=n*o.price*(1-TAX);S.market.sold+=n;if(o.filled>=o.qty){toast(`Sold: ${lName(o)}`);S.market.trades++}}
  }
}
function collectOffer(id,cancel){
  const i=S.market.offers.findIndex(o=>o.id===id);if(i<0)return;const o=S.market.offers[i];
  S.gold+=o.ready;o.ready=0;
  if(cancel){const left=o.qty-o.filled;if(left>0){if(o.cat==='gear')S.bag.push(o.it);else S.bank[o.cat][o.i]+=left}}
  if(cancel||o.filled>=o.qty)S.market.offers.splice(i,1);
}

  const pool=rivals('f2p').concat(rivals('sup')).filter(e=>!e.priv);const hrs=Math.max(1,(Date.now()-LAUNCH)/36e5);
  const v=CLANS.map(([name,tag,color],i)=>{const r=mulberry(i*977+5);const size=6+Math.floor(r()*38);const minFloor=[1,1,10,25,25,50,75,100,150,200,250,300][i];
    const members=[];const seen=new Set();for(let k=0;k<Math.min(size,pool.length);k++){const e=pool[Math.floor(r()*pool.length)];if(seen.has(e.name))continue;seen.add(e.name);members.push(e)}
    members.sort((a,b)=>b.floor-a.floor);const xp=Math.round(size*(2000+r()*6000)+size*hrs*(20+r()*60)*(1+minFloor/100));
    return {id:i,name,tag,color,members,size,minFloor,xp,rate:size*(20+r()*60)*(1+minFloor/100)}});
  _clans={day,v};return v;
}
function myClan(){
  const c=S.clan;if(!c)return null;
  if(c.own){const hrs=(Date.now()-c.at)/36e5;const recruits=Math.min(24,Math.floor(hrs/6));const pool=rivals('f2p').filter(e=>!e.priv&&e.floor<=S.bestEver*1.3);const r=mulberry(hashStr(c.name));const members=[];const seen=new Set();
    for(let k=0;k<recruits&&pool.length;k++){const e=pool[Math.floor(r()*pool.length)];if(!seen.has(e.name)){seen.add(e.name);members.push(e)}}
    return {name:c.name,tag:c.tag,color:c.color,own:true,members,size:members.length+1,xp:c.contrib+members.length*hrs*30,rate:members.length*30}}
  const s=sampleClans()[c.id];return {...s,xp:s.xp+c.contrib,size:s.size+1};
}
function clanLevel(){const c=S.clan?myClan():null;return c?clanLvlOf(c.xp):0}
function weekKey(){const d=new Date();const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));return dayKey(m)}
function clanWeek(){const c=S.clan;if(!c)return null;const k=weekKey();if(c.week.key!==k)c.week={key:k,pts:0,claimed:false};
  const mc=myClan();const start=parseDay(k).getTime();const hrs=(Date.now()-start)/36e5;const target=Math.round(mc.rate*168+5000);
  return {pts:c.week.pts,others:Math.round(mc.rate*hrs),target,claimed:c.week.claimed}}
function clanPts(n){if(!S.clan)return;S.clan.contrib+=n;clanWeek();S.clan.week.pts+=n}
function clanFeed(text){if(!S.clan)return;S.clan.feed.unshift({t:Date.now(),who:S.priv?'Anonymous':S.name,text});S.clan.feed.length=Math.min(S.clan.feed.length,40)}
function sampleFeed(mc){

  for(let i=0;i<6;i++){const m=mc.members[Math.floor(r()*mc.members.length)];out.push({t:(b*9e5)-i*7*6e4,who:m.name,text:lines[Math.floor(r()*lines.length)](m)})}

function joinClan(id){const s=sampleClans()[id];if(S.bestEver<s.minFloor){toast(`${s.name} requires floor ${s.minFloor}`);return}

function createClan(name,tag,color){

  case 'a_cur':{const n=parseFloat($('#aAmt').value);const c=$('#aCur').value;if(isFinite(n)){if(c==='raidkeys')S.raid.keys=Math.min(99,S.raid.keys+Math.floor(n));else S[c]+=n;toast('Granted')}break}
  case 'a_asc':{S.asc=clamp(parseInt($('#aAsc').value)||0,0,50);for(const [r,t] of [[1,'Ascendant'],[5,'Moonborn'],[10,'The Lunatic']])if(S.asc>=r&&!S.titles.includes(t))S.titles.push(t);calc();toast('Ascension rank '+S.asc);break}
  case 'a_floor':{const f=Math.max(1,parseInt($('#aFloor').value)||1);S.floor=f;S.maxFloor=Math.max(S.maxFloor,f);S.bestEver=Math.max(S.bestEver,f);B.idx=0;B.mob=null;toast('Floor '+f);break}
  case 'a_lvl':{const l=clamp(parseInt($('#aLvl').value)||1,1,99);const sk=$('#aSkill').value;for(const x of sk==='all'?['atk','str','def','hp',...GSK]:[sk])S.xp[x]=XPT[l];calc();toast('Level set');break}
  case 'a_uni':giveUnique($('#aUni').value);break;
  case 'a_pet':givePet($('#aPet').value);break;
  case 'a_item':{const s=$('#aSlot').value;const it=mkItem(s,clamp(+$('#aTier').value,0,14),+$('#aRar').value,{wt:s==='weapon'?randWt():null});addLook(it);S.bag.push(it);toast('Item added to bag');break}
  case 'a_ev':S.forceEvent=$('#aEv').value||null;_evCache=null;calc();updateEvBar();toast('Event applied');break;
  case 'a_pass':{const t=+$('#aPass').value;S.pass={tier:t,until:t?Date.now()+30*864e5:0,claim:''};calc();updateEvBar();toast('Pass set');break}
  case 'a_drop':S.dropTest=+$('#aDrop').value;calc();toast('Drop multiplier ×'+S.dropTest);break;
  case 'a_off':showOffline(applyOffline(clamp(+$('#aOff').value,1,24)*3600,true));break;
  case 'a_title':{const t=$('#aTitle').value;if(!S.titles.includes(t))S.titles.push(t);S.title=t;toast('Title granted: '+t);break}
  case 'a_reset':{const b=el;if(b.dataset.armed){try{localStorage.removeItem(SAVEKEY)}catch(e){}S=fresh();calc();B.php=C.maxHp;B.mob=null;B.idx=0;show('train');toast('Save wiped');return}b.dataset.armed='1';b.textContent='Tap again to wipe everything';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Wipe save'}},3500);return}
  }
  refreshNow();save();
}
document.addEventListener('click',e=>{try{onClick(e)}catch(err){reportErr(err,'tap');try{S=migrate(S);calc()}catch(x){}}});
function onClick(e){
  const t=e.target.closest('[data-tab]');if(t){show(t.dataset.tab);return}
  const cc=e.target.closest('[data-cc]');
  if(cc&&draft){const key=cc.dataset.cc;
    if(key==='beard'||key==='hideHelm'){draft[key]=!draft[key];cc.setAttribute('aria-pressed',draft[key])}
    else if(key==='special'){draft.special=draft.special===cc.dataset.v?null:cc.dataset.v;cc.parentElement.querySelectorAll('[data-cc="special"]').forEach(b=>b.setAttribute('aria-pressed',draft.special===b.dataset.v))}
    else{const v=key==='cape'?cc.dataset.v:+cc.dataset.v;draft[key]=v;if(key==='cape')draft.special=null;
      document.querySelectorAll(`[data-cc="${key}"]`).forEach(b=>b.setAttribute('aria-pressed',b===cc));
      if(key==='cape')document.querySelectorAll('[data-cc="special"]').forEach(b=>b.setAttribute('aria-pressed','false'))}
    drawCreator();return}
  const a=e.target.closest('[data-act]');if(a&&!a.disabled)act(a.dataset.act,a);
}
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.ft){S.gath.ft=+e.target.value;show('camp');return}if(e.target.dataset&&e.target.dataset.lbz){lb.zone=+e.target.value;show('ranks');return}const s=e.target.closest('[data-ov]');if(s&&draft){draft.ov[s.dataset.ov]=s.value||null;drawCreator()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#me').addEventListener('click',openProfile);
const press=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn()});
press('#aSpec',()=>{if(!useSpec())toast(`Need ${specCost()}% special energy`)});
press('#aBlock',tryBlock);
press('#aEat',()=>eat(false));
press('#aFire',()=>{if(!useFire()&&S.fire.charges<=0)toast(`Next flask in ${Math.ceil(S.fire.cd)}s`)});
$('#stage').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();
  if(B.raid&&B.raid.orbs.length){const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;let bi=-1,bd=44*44;
    B.raid.orbs.forEach((o,i)=>{const p=orbPos(o);const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;bi=i}});
    if(bi>=0){const p=orbPos(B.raid.orbs[bi]);B.raid.orbs.splice(bi,1);S.spec.bar=Math.min(100,S.spec.bar+5);B.pops.push({x:p.x,y:p.y,t:0});return}}
  tapStrike()});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,select'))return;if(e.key==='q'||e.key==='Q')useSpec();if(e.key===' '){e.preventDefault();tryBlock()}if(e.key==='e'||e.key==='E')useFire()});
function updateActions(){
  const c=specCost(),b=S.spec.bar;$('#aSpecFill').style.width=b+'%';$('#aSpecP').textContent=Math.floor(b)+'%';$('#aSpecN').textContent=SPECS[wtNow()].n;
  $('#aSpec').classList.toggle('ready',b>=c);
  {const dg=!!(B.raid&&B.raid.ash&&!B.raid.ash.dodged);$('#aBlockT').textContent=dg?'Dodge!':'Block';$('#aBlock').classList.toggle('warn',dg||(B.wind>0&&!B.blocked&&B.dead<=0))}$('#aBlock').classList.toggle('cool',B.offbal>0);
  $('#aFireN').textContent=S.fire.charges;$('#aFireC').textContent=S.fire.charges<fireMax()?Math.ceil(S.fire.cd)+'s':'';$('#aFire').classList.toggle('empty',S.fire.charges<=0);$('#aEatN').textContent=fmt(foodCount());$('#aEat').classList.toggle('empty',foodCount()<=0);
}
$('#logo').addEventListener('click',()=>{clearTimeout(logoTimer);logoTaps++;logoTimer=setTimeout(()=>logoTaps=0,2500);if(logoTaps>=7){logoTaps=0;S.admin?openRecovery():adminLogin()}});
function openRecovery(reason){
  const errs=(S.errLog||[]).slice(-4).map(e=>`[${e.w}] ${e.m}`).join('\n');
  openModal(`<div class="shead"><h2>Recovery</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
   ${reason?`<div class="note" style="color:var(--warn);border-color:var(--warn)">${esc(reason)}</div>`:''}
   <div class="muted" style="font-size:13.5px">Playing: <b>${S.testHero?'Test hero':S.season?'Season hero':'Main hero'}</b> · floor ${S.floor} · ${S.bag.length} items in inventory</div>
   <div class="grid2"><button class="btn pri" data-act="rv_safe">Turn on Smooth mode</button><button class="btn" data-act="rv_toggles">Turn off test toggles</button>
   <button class="btn" data-act="rv_trim">Salvage spare items</button><button class="btn" data-act="rv_copy">Copy report for Claude</button></div>
   ${S.testHero?'<button class="btn" data-act="slot" data-v="main">Back to main hero</button>':''}
   <button class="btn" data-act="rv_reset" style="border-color:#7a2a33;color:#ff8a8a">${S._rvArm?'Tap again: erase this hero for good':'Start this hero over'}</button>
   ${errs?`<div style="font-family:ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:#0b0d16;border:1px solid var(--line);border-radius:8px;padding:8px;user-select:text">${esc(errs)}</div>`:''}
   ${S.admin?'<button class="btn" data-act="openadmin">Open admin panel</button>':''}`);
}

/* ================= LOOP ================= */
let last=performance.now(),uiAcc=0,saveAcc=0;
function frame(now){
  try{
  let dt=(now-last)/1000;last=now;
  if(dt>1){const r=applyOffline(dt);if(r)showOffline(r);dt=0}
  if(dt>0&&dt<0.5){ftAvg=ftAvg*0.97+dt*1000*0.03;if(!autoLow&&S.gfx!=='high'&&ftAvg>36&&B.t>6){autoLow=true;if(!lowNoted){lowNoted=true;toast('Switched to Smooth graphics to keep things fast. Change it in Settings.')}}}
  dt=Math.min(dt,0.1);
  try{step(dt)}catch(e){reportErr(e,'step');B.mob=null;B.dead=0.5}
  if(tab==='dungeon'){try{render()}catch(e){reportErr(e,'render');try{ctx.restore();ctx.setTransform(1,0,0,1,0,0)}catch(x){}}}
  updateActions();
  if(tab!=='dungeon'){const m=B.mob;$('#miniT').textContent=`Floor ${S.floor} · ${m?m.name:'Next fight'}${B.wind>0?' · Heavy attack!':''}`;$('#miniP').style.width=pct(clamp(B.php/C.maxHp,0,1));$('#miniM').style.width=m?pct(clamp(m.hp/m.maxHp,0,1)):'0%'}
  uiAcc+=dt;saveAcc+=dt;
  if(uiAcc>0.4){uiAcc=0;updateTop();tutTick();if(refresher&&$('#modal').hidden)refresher();if(!$('#modal').hidden&&document.getElementById('ccv'))drawCreator();
    if(Math.floor(now/2000)!==frame._a){frame._a=Math.floor(now/2000);checkAch()}
    if(Math.floor(now/10000)!==frame._e){loginStreak();frame._e=Math.floor(now/10000);_evCache=null;seasonCheck();calc()}}
  if(saveAcc>5){saveAcc=0;marketSim(5);save()}
  }catch(e){reportErr(e,'frame')}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{last=performance.now()}});
window.addEventListener('pagehide',save);
window.addEventListener('resize',resize);

function boot(data){
  const had=load();
  if(data&&data.S){try{S=migrate(JSON.parse(JSON.stringify(data.S)))}catch(e){}}
  if(!Array.isArray(S.titles))S.titles=['Adventurer'];
  if(S.created<new Date(2026,11,1).getTime()&&!S.titles.includes('Founder')){S.titles.push('Founder');if(S.title==='Adventurer')S.title='Founder';setTimeout(()=>banner('FOUNDER','You played Lunacy Depths in launch month','#a9c1ff'),1200)}
  if(!S.runBest||S.runBest<S.maxFloor)S.runBest=Math.max(S.runBest||1,S.maxFloor);
  applyMeta();
  let hung=null;try{hung=localStorage.getItem('lunacy_switch');if(hung){localStorage.setItem('lunacy_last_hang',hung);localStorage.removeItem('lunacy_switch')}}catch(e){}
  if(hung){S.gfx='low';S.oneHit=false;setTimeout(()=>openRecovery(`Last time, opening the ${hung.split('|')[0]} page froze the game. Smooth mode is now on. If it happens again, tap Salvage spare items or switch to a test hero for admin testing.`),600)}
  if(PROTOTYPE_ADMIN){S.admin=true;if(!S.titles.includes('Owner'))S.titles.push('Owner')}
  for(const it of S.bag)if(!it.id)it.id=uid();
  if(S.tut==null){S.tut=0;tutBase()}
  ensureDaily();calc();B.php=C.maxHp;loginStreak();
  buildNav();show('dungeon');updateTop();updateEvBar();resize();
  if(had){const away=(Date.now()-S.lastSeen)/1000;const r=applyOffline(away);if(r)showOffline(r)}
  else{
    openModal(`<div class="shead"><h2>Welcome to Lunacy Depths</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
     <p style="margin:0">Ten dungeons, 500 floors, and an endless abyss below. Your hero fights on their own, even while you're away.</p>
     <div class="kv"><span>Every floor</span><span>6 fights, then a chest</span><span>Every 10 floors</span><span>A mini-boss</span><span>Every 50 floors</span><span>A dungeon boss</span><span>Rare set pieces</span><span>1/100 per run</span><span>Legendary weapons</span><span>1/1,000 per run</span><span>Pets</span><span>1/3,000 per run</span></div>
     <div class="note">Tap the battle to strike. When a monster shows <b style="color:#ff5a3c">!</b>, hit <b>Block</b> to counter. Fill your energy and fire your <b>Special</b>. Throw a <b>Moonfire Flask</b> to break walls.</div>
     <div class="grid2"><button class="btn" data-act="creator">Create character</button><button class="btn pri" data-act="close">Start</button></div>`);
  }
  window.claude?.hot?.snapshot?.(()=>({S}));
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
